<!doctype html>
<html lang="zh-CN" data-app="word-review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f3ec">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>英语单词复习站</title>
<style>
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --surface-2:#efe9dd;
  --text:#23211d; --muted:#6f6a60; --line:#ddd5c7;
  --accent:#2f6f62; --accent-weak:#e3efea;
  --warn:#a86a1f; --danger:#a63d3d;
  --f0:#b9b3a7; --f1:#8fb9ae; --f2:#4f8f7f; --f3:#b07a2e; --f4:#2f6f62;
  --radius:16px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(35,33,29,.10);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161a; --surface:#1d2026; --surface-2:#262a31;
    --text:#e9e6df; --muted:#a5a095; --line:#333841;
    --accent:#6fb7a4; --accent-weak:#1f3530;
    --warn:#d6a35a; --danger:#e08585;
    --f0:#5f625f; --f1:#5d8f84; --f2:#6fb7a4; --f3:#d6a35a; --f4:#8fd0bf;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#theme-toggle{touch-action:manipulation}
#theme-toggle:active{background:transparent}
body{
  background:var(--bg); color:var(--text); font-family:var(--ui);
  font-size:16px; line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:600;letter-spacing:.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
small,.meta{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.serif{font-family:var(--serif)}
.hidden{display:none !important}

/* shell */
#app{min-height:100vh}
.appbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.appbar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.icon-btn{
  width:44px;height:44px;border-radius:12px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--text);
  flex:0 0 auto;
}
.icon-btn:active{background:var(--surface-2)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.icon-btn[hidden]{display:none !important}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:icon-pop .42s cubic-bezier(.2,.7,.2,1)}
@keyframes icon-pop{0%{transform:rotate(0) scale(1)}45%{transform:rotate(24deg) scale(.9)}100%{transform:rotate(0) scale(1)}}
.screen{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.screen.no-bottom{padding-bottom:24px}
.screen.screen-enter{animation:screen-fade .18s ease-out}
/* v5.3：只锁卡片页；其他页面保留滚动 */
body.cards-lock{overflow:hidden;overscroll-behavior:none}
.screen.cards-screen{height:calc(100dvh - 61px - env(safe-area-inset-top));max-width:560px;display:flex;flex-direction:column;padding:10px 16px calc(8px + env(safe-area-inset-bottom));overflow:hidden}
.cards-screen .q-top,.cards-screen .progress,.cards-screen .cards-unit,.cards-screen .cards-hint{flex:0 0 auto}
.cards-screen .progress{margin:4px 0 2px}
.cards-screen .cards-unit{margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cards-stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
.cards-screen .v5-card{flex:1 1 auto;height:auto;min-height:0;max-height:520px;touch-action:none}
.cards-screen .v5-face{overflow:hidden;padding:16px 18px}
.cards-hint{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 0 2px;font-size:12px;color:var(--muted);white-space:nowrap}
.cards-hint span{opacity:.9}
@keyframes screen-fade{from{opacity:.55}to{opacity:1}}
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;max-width:560px;margin:0 auto;
}
.bottombar .btn{flex:1}
.bottombar .btn.secondary{flex:0 0 auto;min-width:96px}

/* buttons */
.btn{
  min-height:46px;padding:11px 16px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:600;line-height:1.2;
  border:1px solid transparent;background:var(--surface);color:var(--text);
  text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.secondary{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent;font-weight:500;min-height:40px;padding:8px 10px}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{display:flex;width:100%}
.btn.small{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;
}
.card + .card{margin-top:12px}
.card.flat{background:transparent;border-color:transparent;padding:0}
.card h2{margin-bottom:6px}
.card h3{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.divider{height:1px;background:var(--line);margin:16px 0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 10px}
.section-title h2{font-size:18px}
.section-title .meta{white-space:nowrap}

/* home */
.unit-card{display:block;text-align:left;width:100%}
.unit-card .uc-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.unit-card .uc-title{font-size:20px;font-weight:600;line-height:1.3}
.unit-card .uc-theme{font-size:13px;color:var(--muted);margin-top:2px}
.unit-card .uc-foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.unit-card .uc-stat{font-size:13px;color:var(--muted)}
.unit-card .uc-stat b{color:var(--text);font-weight:600}
.home-hero{padding:6px 0 4px}
.home-hero h2{font-size:26px;line-height:1.25;margin-bottom:6px}
.home-hero p{color:var(--muted);font-size:14px}
.current-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:999px;padding:4px 9px;font-weight:600;white-space:nowrap;flex:0 0 auto}

/* level bars */
.levelbar{display:flex;align-items:center;gap:8px;min-height:24px}
.levelbar .lb-label{font-size:12px;color:var(--muted);min-width:44px;white-space:nowrap;flex:0 0 auto}
.levelbar .lb-track{display:flex;gap:3px;flex:1;min-width:0}
.levelbar .seg{height:7px;border-radius:999px;background:var(--line);opacity:.6;flex:1;min-width:0}
.levelbar .seg.on{background:var(--accent);opacity:1}
.levelbar .lb-val{font-size:12px;color:var(--muted);min-width:64px;text-align:right;flex:0 0 auto}
.levelbar.thin .seg{height:5px}
.levelpair{display:flex;flex-direction:column;gap:5px}
.levelpair .lp-row{display:flex;align-items:center;gap:8px}
.levelpair .lp-row .levelbar{flex:1;min-width:0}
.levelpair .lb-label,.levelpair .lb-val{display:none}
.levelpair .lp-name{font-size:12px;color:var(--muted);width:30px}
.levelpair .lp-text{font-size:12px;color:var(--muted);white-space:nowrap}

/* section grid */
.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section-card{
  display:flex;flex-direction:column;gap:8px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px;min-height:92px;
}
.section-card:active{background:var(--surface-2)}
.section-card .sc-top{display:flex;align-items:center;gap:8px}
.section-card .sc-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.section-card .sc-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.section-card .sc-title{font-size:15px;font-weight:600;line-height:1.3}
.section-card .sc-count{font-size:12px;color:var(--muted);margin-top:auto}
.section-card.empty{opacity:.62}
.section-card .sc-progress{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.section-card .sc-progress i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* list */
.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.item-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;background:var(--surface)}
.item-row + .item-row{border-top:1px solid var(--line)}
.item-row:active{background:var(--surface-2)}
.item-row .ir-main{flex:1;min-width:0}
.item-row .ir-term{font-size:16px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .ir-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.item-row .ir-bars{width:84px;flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.item-row .ir-bars .levelbar .lb-label,.item-row .ir-bars .levelbar .lb-val{display:none}
.item-row .ir-bars .levelbar .lb-track{gap:2px}
.item-row .ir-bars .seg{height:5px}
.item-row .ir-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item-row .ir-arrow{color:var(--muted);font-size:18px;line-height:1}
.forget-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.forget-row:first-of-type{border-top:0}
.forget-row input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}
.forget-row .grow{display:flex;flex-direction:column;gap:2px}
.forget-row .meta{display:block}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.4;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.tag.ok{background:var(--accent-weak);color:var(--accent)}

/* detail */
.detail-term{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:.01em}
.detail-ipa{font-size:14px;color:var(--muted);margin-top:4px}
.detail-meaning{font-size:17px;margin-top:8px}
.context-box{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin-top:12px}
.context-box .cb-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.context-box .cb-text{font-family:var(--serif);font-size:17px;line-height:1.7}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:0 0 72px}
.kv .v{flex:1;min-width:0;word-break:break-word}
.kv .v.serif{font-family:var(--serif);font-size:16px}

/* question */
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.q-count{font-size:13px;color:var(--muted);white-space:nowrap}
.progress{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .18s ease}
.q-card{padding:18px 16px}
.q-type{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.q-prompt{font-size:17px;line-height:1.55;font-weight:500}
.q-sentence{font-family:var(--serif);font-size:19px;line-height:1.7;margin:12px 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 12px 12px 0}
.q-sentence .hit{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 2px;font-weight:600}
.q-sub{font-size:13px;color:var(--muted);margin-top:6px}
.audio-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.audio-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.audio-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.option{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  font-size:15px;line-height:1.5;min-height:48px;
}
.option:active{background:var(--surface-2)}
.option .opt-mark{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-top:1px}
.option .opt-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.option .opt-text{display:block}
.option .opt-note{display:block;font-size:12px;line-height:1.55;color:var(--muted);margin-top:2px;padding-top:4px;border-top:1px dashed var(--line)}
.option.correct .opt-note{color:var(--muted)}
.option.selected{border-color:var(--accent);background:var(--accent-weak)}
.option.correct{border-color:var(--accent);background:var(--accent-weak)}
.option.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.option[disabled]{opacity:.85;pointer-events:none}
.answer-input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;line-height:1.4;outline:none}
.answer-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.input-hint{font-size:12px;color:var(--muted);margin-top:6px}
.feedback{margin-top:16px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.feedback.good{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.feedback.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:600}
.fb-head.good{color:var(--accent)}
.fb-head.bad{color:var(--danger)}
.fb-why{font-size:14px;line-height:1.6;margin-top:6px}
.fb-reveal{font-family:var(--serif);font-size:17px;line-height:1.7;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.fb-meta{font-size:13px;color:var(--muted);margin-top:6px}
.basis{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.basis .basis-btn{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.basis-expanded{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6}
.toast{
  position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;
  max-width:528px;margin:0 auto;padding:12px 14px;border-radius:12px;
  background:var(--text);color:var(--bg);font-size:14px;line-height:1.5;
  box-shadow:var(--shadow);text-align:center;
}

/* summary */
.summary-big{font-size:40px;font-weight:600;line-height:1.1}
.summary-sub{font-size:13px;color:var(--muted);margin-top:4px}
.change-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.change-row:last-child{border-bottom:0}
.change-row .cr-l{flex:1;min-width:0}
.change-row .cr-r{color:var(--muted);white-space:nowrap;font-size:12px}

/* settings */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:15px}
.field .field-sub{font-size:12px;color:var(--muted);margin-top:2px}
.seg-control{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg-control button{padding:8px 10px;font-size:13px;color:var(--muted);min-height:38px}
.seg-control button.on{background:var(--accent);color:#fff}
.switch{position:relative;flex:0 0 auto;width:52px;height:30px;border-radius:999px;background:var(--line);transition:background .18s ease;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(22px)}
select{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty .btn{margin-top:12px}
.footer{font-size:12px;color:var(--muted);text-align:center;padding:24px 0 8px;line-height:1.7}
.notice{font-size:13px;line-height:1.6;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.notice .btn{flex:0 0 auto;color:var(--warn)}
.report-pre{white-space:pre-wrap;font-family:var(--ui);font-size:13px;line-height:1.7;background:var(--surface-2);border-radius:10px;padding:12px;margin-top:10px}

/* manual theme (attribute wins over media query) */
:root[data-theme="light"]{
  --bg:#f6f3ec; --surface:#fffdf8; --surface-2:#efe9dd;
  --text:#23211d; --muted:#6f6a60; --line:#ddd5c7;
  --accent:#2f6f62; --accent-weak:#e3efea; --warn:#a86a1f; --danger:#a63d3d;
  --f0:#b9b3a7; --f1:#8fb9ae; --f2:#4f8f7f; --f3:#b07a2e; --f4:#2f6f62;
  --shadow:0 10px 30px rgba(35,33,29,.10);
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2026; --surface-2:#262a31;
  --text:#e9e6df; --muted:#a5a095; --line:#333841;
  --accent:#6fb7a4; --accent-weak:#1f3530; --warn:#d6a35a; --danger:#e08585;
  --f0:#5f625f; --f1:#5d8f84; --f2:#6fb7a4; --f3:#d6a35a; --f4:#8fd0bf;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

/* v4: clickable words / cards / reading / modals */
.term{display:inline;border:0;background:transparent;color:inherit;padding:0;font:inherit;line-height:inherit;text-decoration-line:underline;text-decoration-style:dashed;text-decoration-color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.12em;text-decoration-skip-ink:none;border-radius:2px}
.term:active{background:var(--accent-weak)}
.dict-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.43);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));animation:fade-in .18s ease}

.sense-defs{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;margin:8px 0 0;padding:0;list-style:none;counter-reset:sd;border-top:1px solid var(--line)}
.sense-defs li{position:relative;counter-increment:sd;padding:6px 0 6px 21px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sense-defs li:last-child{border-bottom:0}
.sense-defs li:before{content:counter(sd);position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.sense-defs .sense-pos{margin-right:4px;font-size:10px;color:var(--accent);font-weight:700}
.v5-examples{grid-area:2/1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;margin-top:6px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent)}
.sense-examples{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;margin:0;padding:5px 0 0;list-style:none;counter-reset:se;border-top:1px solid var(--line)}
.sense-examples li{position:relative;counter-increment:se;padding:5px 0 5px 21px;overflow-wrap:anywhere}
.sense-examples li:before{content:counter(se);position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.sense-examples li.is-empty{height:0;padding:0;margin:0;border:0;overflow:hidden}
.sense-examples li.is-empty:before{display:none}
.sense-examples-label{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:4px 0 2px}
.v5-back-ctl{grid-column:2;grid-row:1/3;position:static;width:46px;align-self:start;margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:4px}
.v5-back-ctl .fam-slider.compact{position:relative;right:auto;top:auto;bottom:auto;width:40px;height:132px;margin:0;flex:0 0 auto}
.v5-back-ctl .fam-slider.compact .fam-track{left:50%;top:4px;bottom:24px;width:18px}
.v5-back-ctl .fam-slider.compact .fam-track:before{top:0;bottom:0}
.v5-back-ctl .fam-slider.compact .fam-val{font-size:9px;bottom:-2px}
.v5-back-ctl .mastered-badge{margin:0;padding:3px 6px;font-size:9px;line-height:1.2;text-align:center;white-space:normal}
.v5-back-ctl .btn.small{font-size:9px;padding:2px 3px;min-height:0;line-height:1.3}
.card-sentence{width:100%;text-align:left;font-family:var(--serif);font-size:19px;line-height:1.7;overflow-wrap:anywhere}
.v5-front.is-forget{padding-bottom:64px}
.card-sentence .hit,.sense-ex .hit{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 2px;font-weight:600;color:var(--accent)}
.sense{padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.sense:last-child{border-bottom:0}
.sense-def{font-size:14px;font-weight:600;line-height:1.45}
.sense-pos{display:inline-block;margin-right:4px;font-size:10px;color:var(--accent);font-weight:700}
.sense-ex{font-family:var(--serif);font-size:13px;line-height:1.55;margin-top:4px}
.sense-tr{font-size:12px;line-height:1.5;color:var(--muted);margin-top:2px}
.v5-examples .sense-ex{font-size:17px;line-height:1.6;margin:0}
.sense-fallback{font-family:var(--serif);font-size:14px;line-height:1.65;padding:6px 0}
.sense-fallback-cue{font-size:12px;color:var(--muted);margin-top:4px}
.sense-empty{font-size:12px;color:var(--muted);padding:10px 0}
.dict-senses{max-height:38vh;overflow-y:auto;overscroll-behavior:contain;margin-top:8px;padding-right:4px;border-top:1px solid var(--line)}
/* v5.13 易混卡片 / 拼写本 */
.cfg-card .v5-back{overflow:hidden}
.cfg-front-term{font-size:17px;line-height:1.55;padding:3px 0;border-bottom:1px dashed var(--line);display:flex;align-items:baseline;gap:8px}
.cfg-front-term b{font-weight:650}
.cfg-back{position:absolute;inset:0;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cfg-row{padding:8px 0;border-bottom:1px solid var(--line)}
.cfg-row:last-of-type{border-bottom:0}
.cfg-row-head{font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cfg-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.cfg-distinct{margin-top:10px;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:8px;font-size:12.5px;line-height:1.55}
.spell-book-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.spell-book-row:last-child{border-bottom:0}
.spell-book-row .grow{flex:1;min-width:0}
.spell-book-row b{font-size:15px}
</style>
</head>
